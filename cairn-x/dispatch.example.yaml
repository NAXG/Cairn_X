# Cairn_X orchestrator configuration (Executor Worker architecture).
#
# Usage:
#   cp dispatch.example.yaml dispatch.yaml   # then edit
#   npm run cli -- serve --config dispatch.yaml --import-config   # fresh DB: seed settings from this file
#   npm run cli -- serve --config dispatch.yaml                    # normal start
#   npm run cli -- dispatch --config dispatch.yaml                 # in another shell

# FGS server API endpoint (as seen from the dispatcher).
server: "http://127.0.0.1:8000"

runtime:
  # Scheduler tick interval in seconds.
  interval: 3
  # Concurrency caps are seeded into the database on first import only;
  # afterwards they live in Settings → 运行 (runtime settings) and the YAML
  # values below are ignored by serve/dispatch.
  max_workers: 9
  max_running_projects: 3
  max_project_workers: 3
  decide_min_interval: 10
  # When a model endpoint returns "unhealthy", the offending project is not
  # dispatched to again for this many seconds; after endpoint_unhealthy_threshold
  # consecutive unhealthy outcomes the whole activity cools down instead
  # (a success clears both immediately).
  endpoint_cooldown: 5
  endpoint_unhealthy_threshold: 3

models:
  # Seed-only: imported into the configuration database on --import-config when
  # the database has never been initialized. Normal startups never read these
  # values and never overwrite what the web console saved.
  decide:
    model_id: "deepseek-flash"
    # OpenAI 兼容端点的 base_url 不带 /anthropic 路径。
    base_url: "https://api.deepseek.com"
    api: "openai-completions" # anthropic-messages | openai-completions | openai-responses
    # Literal key, or "env:VAR_NAME" to read it from the environment (preferred;
    # keys are never logged). The key stays on the control plane — workers only
    # ever receive short-lived execution tokens.
    api_key: "env:DECIDE_API_KEY"
    # 上下文预算与单次输出上限；必须显式写出，省略会退回代码兜底值（128k / 32k）。
    context_window: 256000
    max_output_tokens: 128000
  # Seed-only: imported on --import-config; the DB profile is authoritative afterwards.
  execute:
    model_id: "deepseek-flash"
    base_url: "https://api.deepseek.com"
    api: "openai-completions"
    api_key: "env:EXECUTE_API_KEY"
    context_window: 256000
    max_output_tokens: 128000

# Optional. TSecBench benchmark integration. The platform token (BENCHMARK_TOKEN)
# stays in the serve process; workers proxy submit/hint through the execution
# protocol, so it never reaches a worker container. The integration can also be
# enabled with just BENCHMARK_TOKEN / BENCHMARK_BASE_URL in the environment.
# Setup (including the required benchmark VPN) is documented in the
# repository README under "TSecBench 评测接入".
# benchmark:
#   base_url: "https://tsecbench.zc.tencent.com"
#   token: "env:BENCHMARK_TOKEN" # or the literal uuid from the platform
#   max_active: 3               # concurrent target containers (platform hard cap)
#   auto_start: true            # start the target container on bind
#   auto_close: true            # release it when the challenge completes/times out
#   challenge_timeout: 7200     # seconds per challenge

# Worker containers: one long-lived container per active project
# (`cairn-pw-<projectId>`), entrypoint = Worker program; the loop runs up to
# max_project_workers steps concurrently in it. The dispatcher only claims
# leases, manages containers, enforces deadlines and decides cancellations.
container:
  # Worker image (build with cairn-x/Dockerfile.cairn-x): the worker program plus
  # basic networking tools, the local knowledge bases under /opt/ctf/knowledges,
  # and a preinstalled pentest tool layer (PENTEST_TOOLS, see the Dockerfile).
  # Build with --build-arg PENTEST_TOOLS=0 for a slim image. No docker CLI, no
  # socket, no long-term keys.
  image: "cairn-x-worker:latest"
  # Dedicated container network shared with the control plane. In docker
  # compose this is the compose default network (see docker-compose.yaml);
  # the worker reaches the server at http://cairn-x-server:8000.
  network: "cairn-workers"
  # URL workers use to reach the control plane. When omitted it is derived from
  # the `server` host: a non-loopback host is used as-is (compose service alias
  # `cairn-x-server`), while 127.0.0.1/localhost/0.0.0.0 is rewritten to
  # host.docker.internal because a container cannot reach the host loopback.
  # Set it explicitly only when the derived address is not what workers can use.
  # worker_control_url: "http://cairn-x-server:8000"
  # Resource limits per worker container.
  cpus: 2
  memory_mb: 2048
  pids_limit: 512
  # Cancel semantics: SIGTERM to the worker (it aborts the agent and the tool
  # process tree, then reports a final result), after this many seconds the
  # container is SIGKILLed regardless.
  stop_grace_seconds: 20
  # Keep containers that exit without reporting a result so the dispatcher can
  # read the exit code (137=OOM, 1=crash, 3=claim failure) and the log tail;
  # both are folded into the execution's error field for post-mortem analysis.
  # Containers are still removed explicitly once the attempt is finalized, and
  # orphans are reaped. Set true to restore `docker run --rm` (loses evidence).
  auto_remove: false
  project_idle_seconds: 600

tasks:
  execute:
    # Seed-only: the authoritative runtime timeouts are the Execute agent
    # profile in the configuration center (Settings → Agents → Execute →
    # run/harvest seconds). The values below are used only when a fresh
    # database imports this file; afterwards the YAML numbers are ignored.
    step_timeout: 1200
    # After a successful main run, a harvest pass re-prompts the same session
    # with a forced wrap-up instruction (no more world tools; submit every
    # confirmed-but-unsubmitted fact via submit_fact, submit_finding for key
    # results, then summarize). This is the time cap for that pass, in seconds.
    harvest_timeout: 180
    # 连续失败达到上限后服务端自动放弃 Step 并触发 Decide；
    # 可用环境变量 CAIRN_MAX_STEP_ATTEMPTS 覆盖（默认 3）。
    #
    # Default timeout, in seconds, injected into every bash tool call. PI's bash
    # has NO default timeout, so without this a single long command (full port
    # scan, big wordlist) blocks the agent loop at the tool boundary: the 1/3 and
    # 2/3 progress reminders and the soft budget only fire at turn boundaries, so
    # the graceful wrap-up never runs and the control plane has to hard-kill the
    # container — losing every confirmed-but-unsubmitted fact. The model may pass
    # an explicit `timeout`; an explicit value is used as-is, so long jobs must be
    # chunked or backgrounded by the model. The configured default is also used
    # as-is. Default 300 (5 minutes).
    # bash_timeout: 300
# Optional context-compaction tuning (PI harness). Compaction triggers when
# estimated context tokens exceed context_window - reserve_tokens; after
# compaction about keep_recent_tokens of recent messages are kept, the rest is
# replaced by an LLM summary. These values are wired into activity snapshots.
# Note: PI estimates tokens as chars/4, which underestimates CJK text; increase
# reserve_tokens when project prompts/outputs are mostly Chinese.
# compaction:
#   reserve_tokens: 16384
#   keep_recent_tokens: 20000

healthcheck:
  # Timeout in seconds for startup probes (docker daemon, model endpoints).
  timeout: 20
