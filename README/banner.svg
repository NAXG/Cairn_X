		<rect x="-14" y="-14" width="28" height="28" transform="rotate(45)" filter="url(#soft)" fill="#d4a017" opacity="0.7" />
		<rect x="-12" y="-12" width="24" height="24" transform="rotate(45)" fill="#0a0f16" />
		<rect x="-10" y="-10" width="20" height="20" transform="rotate(45)" fill="#d4a017" />
	</g>

