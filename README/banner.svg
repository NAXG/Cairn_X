<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
	<defs>
		<linearGradient id="sub2" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#2f9fd0" />
			<stop offset="0.55" stop-color="#3fd0c0" />
			<stop offset="1" stop-color="#5ff0d8" />
		</linearGradient>
		<linearGradient id="tagline" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#3f8f8a" />
			<stop offset="0.5" stop-color="#4dc4b4" />
			<stop offset="1" stop-color="#7df3de" />
		</linearGradient>
		<radialGradient id="ambient" cx="0.74" cy="0.24" r="0.62">
			<stop offset="0" stop-color="#10394a" stop-opacity="0.5" />
			<stop offset="1" stop-color="#070a10" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="goalHalo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#22c55e" stop-opacity="0.32" />
			<stop offset="1" stop-color="#22c55e" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="originHalo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#38bdf8" stop-opacity="0.3" />
			<stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
		</radialGradient>
		<filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
			<feGaussianBlur stdDeviation="7" />
		</filter>
		<filter id="soft2" x="-120%" y="-120%" width="340%" height="340%">
			<feGaussianBlur stdDeviation="3.5" />
		</filter>
		<!-- 节点：外发光 + 实心圆 + 亮核 -->
		<g id="node">
			<circle r="13" filter="url(#soft)" fill="currentColor" opacity="0.85" />
			<circle r="12" fill="#0a0f16" />
			<circle r="9.5" fill="currentColor" />
			<circle r="4" fill="#ffffff" opacity="0.85" />
		</g>
		<g id="ghost">
			<circle r="9" fill="#10161f" stroke="#39424f" stroke-width="3" />
		</g>
		<g id="hintNode">
			<circle r="12" fill="#0a0f16" stroke="#f59e0b" stroke-width="3.5" />
			<circle r="4" fill="#f59e0b" />
		</g>
		<g id="cross" stroke="#3d4655" stroke-width="5" stroke-linecap="round">
			<line x1="-9" y1="-9" x2="9" y2="9" />
			<line x1="9" y1="-9" x2="-9" y2="9" />
		</g>
	</defs>

	<rect width="1774" height="887" fill="#070a10" />
	<rect width="1774" height="887" fill="url(#ambient)" />

	<!-- ================= 未知状态空间：底色网格 ================= -->
	<g stroke="#131a24" stroke-width="1.5" opacity="0.5">
		<line x1="812" y1="742" x2="1502" y2="122" />
		<line x1="900" y1="716" x2="1310" y2="196" />
		<line x1="770" y1="612" x2="1602" y2="286" />
		<line x1="936" y1="790" x2="1636" y2="426" />
		<line x1="828" y1="530" x2="1372" y2="82" />
		<line x1="1010" y1="770" x2="1420" y2="640" />
		<line x1="742" y1="690" x2="1200" y2="790" />
		<line x1="1240" y1="800" x2="1650" y2="352" />
		<line x1="1160" y1="128" x2="1580" y2="592" />
		<line x1="880" y1="404" x2="1476" y2="666" />
		<line x1="1046" y1="230" x2="1660" y2="700" />
		<line x1="816" y1="240" x2="1024" y2="330" />
	</g>
	<g fill="#232c38">
		<circle cx="868" cy="452" r="7" />
		<circle cx="1082" cy="240" r="7" />
		<circle cx="1216" cy="536" r="7" />
		<circle cx="1348" cy="128" r="7" />
		<circle cx="1452" cy="502" r="7" />
		<circle cx="1566" cy="648" r="7" />
		<circle cx="1294" cy="742" r="7" />
		<circle cx="1004" cy="756" r="7" />
		<circle cx="936" cy="336" r="7" />
		<circle cx="1176" cy="686" r="7" />
		<circle cx="1530" cy="470" r="7" />
		<circle cx="844" cy="196" r="7" />
