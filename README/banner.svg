		<circle cx="1000" cy="430" r="9" />
		<circle cx="1400" cy="360" r="9" />
		<circle cx="1540" cy="320" r="9" />
		<circle cx="1620" cy="240" r="9" />
		<circle cx="1180" cy="250" r="9" />
		<circle cx="1206" cy="448" r="9" />
		<circle cx="1294" cy="742" r="9" />
	</g>
	<use href="#hintNode" x="1140" y="618" />
	<use href="#hintNode" x="1345" y="196" />
	<!-- Finding 菱形 -->
