		<path d="M1340 300 L1400 360 L1452 402" />
		<path d="M1428 262 L1540 320 L1600 352" />
		<path d="M1516 178 L1620 240 L1666 212" />
		<path d="M1268 342 L1180 250 L1120 208" />
		<path d="M1116 452 L1206 448 L1252 594" />
	</g>
