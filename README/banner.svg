	<path d="M1186 392 L1215 480" stroke="#d4a017" stroke-width="3" stroke-dasharray="8 7" fill="none" opacity="0.9" />

	<g>
		<use href="#cross" x="930" y="300" />
		<use href="#cross" x="1120" y="208" />
		<use href="#cross" x="1452" y="402" />
		<use href="#cross" x="1600" y="352" />
		<use href="#cross" x="1666" y="212" />
		<use href="#cross" x="1090" y="692" />
		<use href="#cross" x="1252" y="594" />
	</g>

