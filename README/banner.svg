		<use href="#node" x="820" y="688" />
		<use href="#node" x="898" y="628" />
		<use href="#node" x="972" y="570" />
	</g>
	<g color="#8b7cf6">
		<use href="#node" x="1046" y="512" />
		<use href="#node" x="1116" y="452" />
		<use href="#node" x="1186" y="392" />
	</g>
	<g color="#22c55e">
		<use href="#node" x="1268" y="342" />
		<use href="#node" x="1340" y="300" />
		<use href="#node" x="1352" y="368" />
		<use href="#node" x="1428" y="262" />
