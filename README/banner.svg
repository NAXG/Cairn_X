	<!-- ================= 搜索路径 ================= -->
	<!-- 已探索（蓝/紫）主干 -->
	<g stroke-width="4.5" fill="none" stroke-linecap="round">
		<path d="M820 688 L898 628" stroke="#38bdf8" opacity="0.85" />
		<path d="M898 628 L972 570" stroke="#38bdf8" opacity="0.85" />
		<path d="M972 570 L1046 512" stroke="#8b7cf6" opacity="0.85" />
		<path d="M1046 512 L1116 452" stroke="#8b7cf6" opacity="0.85" />
		<path d="M1116 452 L1186 392" stroke="#8b7cf6" opacity="0.85" />
	</g>
	<!-- 接近目标（绿） -->
	<g stroke-width="5.5" fill="none" stroke-linecap="round" filter="url(#soft2)">
		<path d="M1186 392 L1268 342" stroke="#22c55e" opacity="0.9" />
		<path d="M1268 342 L1340 300" stroke="#22c55e" opacity="0.9" />
		<path d="M1268 342 L1352 368" stroke="#22c55e" opacity="0.9" />
		<path d="M1340 300 L1428 262" stroke="#22c55e" opacity="0.9" />
		<path d="M1352 368 L1428 262" stroke="#22c55e" opacity="0.9" />
		<path d="M1428 262 L1516 178" stroke="#22c55e" opacity="0.9" />
