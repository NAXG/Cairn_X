		<circle cx="1516" cy="178" r="86" stroke="#22c55e" stroke-width="1.4" opacity="0.22" />
		<circle cx="1516" cy="178" r="112" stroke="#22c55e" stroke-width="1.2" opacity="0.12" />
	</g>
	<g color="#22c55e">
		<circle cx="1516" cy="178" r="40" filter="url(#soft)" fill="#22c55e" opacity="0.75" />
		<circle cx="1516" cy="178" r="34" fill="#0a0f16" />
		<circle cx="1516" cy="178" r="28" fill="#22c55e" />
		<circle cx="1516" cy="178" r="11" fill="#ffffff" opacity="0.9" />
	</g>

	<!-- 图上标签 -->
	<g font-size="26" font-weight="600" letter-spacing="1.5">
		<text x="828" y="784" fill="#38bdf8">ORIGIN</text>
		<text x="1580" y="176" fill="#22c55e">GOAL</text>
	</g>
	<g font-size="20" fill="#64748b">
		<text x="828" y="812">The starting point.</text>
		<text x="1580" y="206">The objective.</text>
		<text x="1580" y="232">The destination.</text>
	</g>
	<text x="1256" y="488" fill="#d4a017" font-size="22" font-weight="600" letter-spacing="1.5">FINDING</text>

	<!-- ================= 左侧标识区 ================= -->
	<text x="84" y="268" fill="#f2f6f9" font-size="168" font-weight="700" letter-spacing="8">CAIRN</text>

	<text x="84" y="364" fill="#dfe8f2" font-size="38">AI Autonomous Pentesting Agent</text>
	<text x="84" y="416" fill="url(#sub2)" font-size="38">General Problem Solving Engine</text>

	<line x1="84" y1="466" x2="176" y2="466" stroke="#2dd4bf" stroke-width="3" />

	<!-- 图例：2 × 2 -->
	<g>
		<circle cx="96" cy="546" r="11" fill="#38bdf8" opacity="0.22" filter="url(#soft2)" />
		<circle cx="96" cy="546" r="10" fill="#38bdf8" />
		<circle cx="96" cy="546" r="4" fill="#ffffff" opacity="0.85" />
		<text x="130" y="554" fill="#38bdf8" font-size="24" font-weight="600" letter-spacing="2">FACT</text>
		<text x="130" y="586" fill="#6b7c93" font-size="19">The known.</text>
		<text x="130" y="612" fill="#6b7c93" font-size="19">Observed truth.</text>
	</g>
	<g>
		<circle cx="482" cy="546" r="11" fill="#8b7cf6" opacity="0.22" filter="url(#soft2)" />
		<circle cx="482" cy="546" r="10" fill="#8b7cf6" />
		<circle cx="482" cy="546" r="4" fill="#ffffff" opacity="0.85" />
		<text x="516" y="554" fill="#8b7cf6" font-size="24" font-weight="600" letter-spacing="2">STEP</text>
		<text x="516" y="586" fill="#6b7c93" font-size="19">The next move.</text>
		<text x="516" y="612" fill="#6b7c93" font-size="19">Action that evolves state.</text>
	</g>
	<g>
		<circle cx="96" cy="686" r="10" fill="none" stroke="#f59e0b" stroke-width="3" />
		<circle cx="96" cy="686" r="3.5" fill="#f59e0b" />
		<text x="130" y="694" fill="#f59e0b" font-size="24" font-weight="600" letter-spacing="2">HINT</text>
		<text x="130" y="726" fill="#6b7c93" font-size="19">The possibility.</text>
		<text x="130" y="752" fill="#6b7c93" font-size="19">Heuristic guidance.</text>
	</g>
	<g>
		<rect x="472" y="676" width="20" height="20" transform="rotate(45 482 686)" fill="#d4a017" />
		<text x="516" y="694" fill="#d4a017" font-size="24" font-weight="600" letter-spacing="2">FINDING</text>
		<text x="516" y="726" fill="#6b7c93" font-size="19">The artifact.</text>
		<text x="516" y="752" fill="#6b7c93" font-size="19">Structured result.</text>
	</g>

	<text x="84" y="836" fill="url(#tagline)" font-size="18" font-weight="500" letter-spacing="6" font-family="Menlo, monospace">EXPLORE. REASON. EMERGE. SOLVE.</text>
</svg>
